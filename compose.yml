services:
  control-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: examaware
      POSTGRES_PASSWORD: examaware
      POSTGRES_DB: examaware_control
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - control-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    stop_grace_period: 10s

volumes:
  control-postgres-data:
