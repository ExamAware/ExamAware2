name: examaware-control
services:
  control-postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examaware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:-examaware_control}
    volumes:
      - control-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  control-server:
    image: ${CONTROL_REGISTRY:-ghcr.io}/examaware/control-server:${CONTROL_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      control-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CONTROL_SERVER_PORT: '3100'
      DATABASE_URL: postgres://${POSTGRES_USER:-examaware}:${POSTGRES_PASSWORD}@control-postgres:5432/${POSTGRES_DB:-examaware_control}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL missing in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET missing in .env}
      DEVICE_CREDENTIAL_PEPPER: ${DEVICE_CREDENTIAL_PEPPER:?DEVICE_CREDENTIAL_PEPPER missing in .env}
      CONTROL_ADMIN_USERNAME: ${CONTROL_ADMIN_USERNAME:-admin}
      CONTROL_ADMIN_NAME: ${CONTROL_ADMIN_NAME:-School administrator}
      CONTROL_ADMIN_PASSWORD: ${CONTROL_ADMIN_PASSWORD:-}
      API_DOCS_ENABLED: 'false'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  control-caddy:
    image: ${CONTROL_REGISTRY:-ghcr.io}/examaware/control-console:${CONTROL_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      control-server:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
volumes:
  control-postgres-data:
